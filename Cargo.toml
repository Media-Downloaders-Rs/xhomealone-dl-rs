[package]
name = "xhomealone-dl-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "personal_downloaders"
path = "src/lib.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:image"]
cli = []

[dependencies]
anyhow = "1"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"], optional = true }
flate2 = "1"
fs2 = "0.4"
futures-util = "0.3"
httpdate = "1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"], optional = true }
md-5 = "0.10"
regex = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
rfd = { version = "=0.17.2", optional = true }
rusqlite = { version = "=0.38.0", features = ["bundled", "backup"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
url = "2"
tempfile = "3"
tungstenite = "0.28"

[[bin]]
name = "xhomealone-dl"
path = "src/main.rs"
required-features = ["gui"]

[profile.release]
lto = true
codegen-units = 1
strip = true
